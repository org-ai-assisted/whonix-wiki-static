name: Deploy Pages

# Modern (GitHub Actions) Pages deployment -- replaces the legacy branch builder, which stopped
# building new commits here (opaque queue, no logs). This runs on every push: deterministic,
# observable, immune to the legacy build queue. deploy-stage.sh pushes the built tree to master.

# Quote the key: unquoted `on:` is parsed as the YAML 1.1 boolean True, which trips
# workflow linters (they cannot find the triggers) -- GitHub Actions accepts "on".
"on":
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys; never cancel an in-flight publish mid-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 20, not 10: uploading the full static-site artifact (thousands of files +
    # media) can exceed 10 min on a slow runner and cancel the deploy.
    timeout-minutes: 20
    # Publish Pages ONLY in the stage orgs; the org-ai-assisted mirror has no Pages site, so the
    # deploy-pages step would fail there. Byte-identical across both stage repos.
    if: github.repository_owner != 'org-ai-assisted'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No git op runs after checkout (rsync + transform + Pages deploy via OIDC), so do not
          # leave the checkout token in .git/config for later steps to read.
          persist-credentials: false
      - name: Stage site (exclude repo-only files from the published artifact)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='_site' \
            --exclude='debian' --exclude='make-helper-overrides.bsh' \
            --exclude='README*' --exclude='openpgp-policy.toml' \
            ./ _site/
      - name: Staging transforms (noindex meta, card hosts, stage robots.txt)
        # The committed HTML is the pristine production (--prod) build: real www.* canonical, no
        # robots noindex. Transform the BUILT ARTIFACT only (never the commit), so this stage
        # preview stays out of search indexes regardless of the build mode that produced the
        # commit. De-index posture: per-page noindex,nofollow meta + a deterministic crawlable
        # robots.txt (so the noindex is read; the nofollow stops crawlers discovering the non-HTML
        # assets, which GitHub Pages cannot noindex). verify fails the deploy if a page is not
        # noindexed or robots.txt is not the policy.
        run: |
          # Invoked via python3 (not ./...): no execute-bit dependency, so a missed +x on the
          # selftest can never break the whole deploy at this step.
          python3 .github/pages-transform-selftest.py
          .github/pages-transform.py transform _site
          .github/pages-transform.py verify _site
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        with:
          # 20 min (default 10): the Pages backend can take >10 min to process this large site,
          # and the action's own timeout -- not the job timeout-minutes -- aborts the deploy.
          timeout: 1200000
